e="#7C5230" stroke-width="1.2" stroke-linecap="round"/></g><g><path d="M70 61 Q88 52 86 28" fill="none" stroke="#3A2618" stroke-width="9.8" stroke-linecap="round"/><path d="M70 61 Q88 52 86 28" fill="none" stroke="#6B4423" stroke-width="7.6" stroke-linecap="round"/><circle cx="86" cy="28" r="4.4" fill="#6B4423" stroke="#3A2618" stroke-width="1.1"/><path d="M84.0 29.5 l-2.4 -3 M86 29.5 l0 -3.6 M88.0 29.5 l2.4 -3" stroke="#7C5230" stroke-width="1.2" stroke-linecap="round"/></g></g><g class="rd-q"><path d="M96 2 q0 -8 7.5 -8 q7.5 0 7.5 7 q0 4.6 -5 7 q-2.4 1.1 -2.4 4.6" fill="none" stroke="#0A9BB5" stroke-width="3.2" stroke-linecap="round"/><circle cx="103.6" cy="18.5" r="2.2" fill="#0A9BB5"/></g></g></g></svg>
