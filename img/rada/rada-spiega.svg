.5 99.5 60 93 Q53.5 99.5 47 93 Q41 99 34 93 Z" fill="#1E6B4F" stroke="#1B2540" stroke-width="1.6" stroke-linejoin="round"/><path d="M49 72 Q60 68 71 72 L77 89 Q72 92 68 88 Q64 92 60 88 Q56 92 52 88 Q48 92 43 89 Z" fill="#6DB894" opacity=".85"/><path d="M50 57 Q60 53 70 57 L72 71 Q60 74 48 71 Z" fill="#E3A22E" stroke="#1B2540" stroke-width="1.6" stroke-linejoin="round"/><circle cx="60" cy="71" r="2.2" fill="#FFC94D" stroke="#1B2540" stroke-width=".9"/><circle cx="53.5" cy="70.4" r="1.2" fill="#FFC94D"/><circle cx="66.5" cy="70.4" r="1.2" fill="#FFC94D"/><path d="M57.5 51 h5 v6 h-5 Z" fill="#F2BFA0"/><path d="M31 32 C28 3 92 3 89 32 L91 50 Q85 57 79 50 L41 50 Q35 57 29 50 Z" fill="#B5552B" stroke="#1B2540" stroke-width="1.6" stroke-linejoin="round"/><path d="M38.5 30 L27 22 L38 39 Z M81.5 30 L93 22 L82 39 Z" fill="#FAD7BE" stroke="#1B2540" stroke-width="1.4" stroke-linejoin="round"/><ellipse cx="60" cy="33" rx="22.5" ry="21" fill="#FAD7BE" stroke="#1B2540" stroke-width="1.6"/><g class="rd-cheek"><ellipse cx="45.5" cy="40.5" rx="3.6" ry="2.4" fill="#F2998A" opacity=".7"/><ellipse cx="74.5" cy="40.5" rx="3.6" ry="2.4" fill="#F2998A" opacity=".7"/></g><g class="rd-look"><g class="rd-eyes"><ellipse cx="52" cy="34" rx="4.1" ry="4.59" fill="#1B2540"/><circle cx="53.44" cy="32.16" r="1.56" fill="#FFFFFF"/><circle cx="50.56" cy="35.64" r="0.74" fill="#FFFFFF"/><ellipse cx="68" cy="34" rx="4.1" ry="4.59" fill="#1B2540"/><circle cx="69.44" cy="32.16" r="1.56" fill="#FFFFFF"/><circle cx="66.56" cy="35.64" r="0.74" fill="#FFFFFF"/><path d="M46.5 31 l-3 -2 M47.5 28.6 l-2 -2.8 M73.5 31 l3 -2 M72.5 28.6 l2 -2.8" stroke="#1B2540" stroke-width="1.4" stroke-linecap="round"/></g></g><path d="M54.5 41.5 Q60 50.5 65.5 41.5 Z" fill="#1B2540"/><ellipse cx="60" cy="46" rx="2.8" ry="1.6" fill="#F2998A"/><path d="M36 28 C35 6 85 6 84 28 C79 20 74 23 70 16 C66 23 58 23 55.5 15.5 C52 22.5 42 21 36 28 Z" fill="#B5552B" stroke="#1B2540" stroke-width="1.6" stroke-linejoin="round"/><path class="rd-shine" d="M44 14 Q50 9 58 9" fill="none" stroke="#E89A62" stroke-width="2.6" stroke-linecap="round"/><g transform="translate(80 13)"><path class="rd-tip" d="M0 -5.5 L1.6 -1.8 L5.5 -1.7 L2.4 .8 L3.4 4.7 L0 2.5 L-3.4 4.7 L-2.4 .8 L-5.5 -1.7 L-1.6 -1.8 Z" fill="#FFC94D" stroke="#1B2540" stroke-width="1" stroke-linejoin="round"/></g><g class="rd-swing"><path d="M50 61 Q42 70 42 80" fill="none" stroke="#1B2540" stroke-width="6.6" stroke-linecap="round"/><path d="M50 61 Q42 70 42 80" fill="none" stroke="#FAD7BE" stroke-width="4.2" stroke-linecap="round"/><circle cx="42" cy="80" r="3.9" fill="#FAD7BE" stroke="#1B2540" stroke-width="1.3"/></g><g class="rd-point"><g><path d="M70 61 Q80 58 84 52" fill="none" stroke="#1B2540" stroke-width="6.6" stroke-linecap="round"/><path d="M70 61 Q80 58 84 52" fill="none" stroke="#FAD7BE" stroke-width="4.2" stroke-linecap="round"/><circle cx="84" cy="52" r="3.9" fill="#FAD7BE" stroke="#1B2540" stroke-width="1.3"/></g><g data-wand="1"><path d="M85 50 L92 38" stroke="#1B2540" stroke-width="2.6" stroke-linecap="round"/><path d="M85 50 L92 38" stroke="#FFC94D" stroke-width="1.2" stroke-linecap="round"/><g transform="translate(92 38)"><circle class="rd-ping" r="8" fill="#FFE7A3" opacity=".75"/><path class="rd-star" d="M0 -7 L2 -2.4 L7 -2.2 L3.1 1 L4.4 6 L0 3.2 L-4.4 6 L-3.1 1 L-7 -2.2 L-2 -2.4 Z" fill="#FFC94D" stroke="#1B2540" stroke-width="1.1" stroke-linejoin="round"/></g></g><!--/wand--></g><g><rect x="95" y="2" width="25" height="31" rx="4" fill="#FFFFFF" stroke="#1B2540" stroke-width="2"/><path d="M99.5 10.5 h3 M99.5 17.5 h3 M99.5 24.5 h3" stroke="#2E7FB8" stroke-width="2.8" stroke-linecap="round"/><path d="M106 10.5 h9.5 M106 17.5 h9.5 M106 24.5 h6.5" stroke="#1B2540" stroke-width="2" stroke-linecap="round"/></g></g></g></svg>
