4" cy="34.06" r="0.7" fill="#FFFFFF"/><path d="M47 25.5 Q52 23 56 25" fill="none" stroke="#2E2470" stroke-width="2.2" stroke-linecap="round"/><path d="M64 25 Q68 23 73 25.5" fill="none" stroke="#2E2470" stroke-width="2.2" stroke-linecap="round"/></g></g><g fill="none" stroke="#C99A2E" stroke-width="1.7"><circle cx="52" cy="34" r="6.8"/><circle cx="68" cy="34" r="6.8"/><path d="M58.6 32.6 Q60 31 61.4 32.6"/></g><path d="M55.5 40.5 L64.5 40.5 L60 48 Z" fill="#F59E2B" stroke="#2B2250" stroke-width="1.1" stroke-linejoin="round"/><path d="M47 9 L47 15 Q60 20.5 73 15 L73 9 Z" fill="#2B2250"/><path d="M34 6 L60 -5 L86 6 L60 16 Z" fill="#2B2250" stroke="#2B2250" stroke-width="1.2" stroke-linejoin="round"/><path d="M40 6 L60 -1.5 L80 6" fill="none" stroke="#5A4E8C" stroke-width="1"/><circle cx="60" cy="5" r="1.8" fill="#FFC94D"/><g class="rd-swing"><path d="M60 5 L80 9 L81 20" fill="none" stroke="#FFC94D" stroke-width="1.6" stroke-linecap="round"/><path d="M78.5 19 h5 l-1 6 h-3 Z" fill="#FFC94D" stroke="#2B2250" stroke-width=".8"/></g><g class="rd-swing"><path d="M50 61 Q42 70 42 80" fill="none" stroke="#2B2250" stroke-width="9.8" stroke-linecap="round"/><path d="M50 61 Q42 70 42 80" fill="none" stroke="#3F31A3" stroke-width="7.4" stroke-linecap="round"/><circle cx="42" cy="80" r="4.6" fill="#3F31A3" stroke="#2B2250" stroke-width="1.3"/></g><g><path d="M70 61 Q78 54 66 49" fill="none" stroke="#2B2250" stroke-width="9.8" stroke-linecap="round"/><path d="M70 61 Q78 54 66 49" fill="none" stroke="#3F31A3" stroke-width="7.4" stroke-linecap="round"/><circle cx="65" cy="49" r="4.6" fill="#3F31A3" stroke="#2B2250" stroke-width="1.3"/></g><circle class="rd-dot" cx="86" cy="18" r="2.4" fill="#0A9BB5"/><circle class="rd-dot b" cx="94" cy="9" r="3.4" fill="#0A9BB5"/><circle class="rd-dot c" cx="104" cy="-2" r="4.8" fill="#0A9BB5"/><g class="rd-sym"><path d="M92 92 Q99 88 106 92 Q113 88 120 92 L120 104 Q113 100 106 104 Q99 100 92 104 Z" fill="#FFFFFF" stroke="#2B2250" stroke-width="1.4" stroke-linejoin="round"/><path d="M106 92 V104 M95 95 h7 M95 98 h6 M109 95 h7 M109 98 h6" stroke="{L}" stroke-width="1.1" stroke-linecap="round"/></g></g></g></svg>
