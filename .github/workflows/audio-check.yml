name: Controllo audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/audio-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Il lettore riceve audio/mpeg?
        run: |
          for N in $(seq 24 40); do
            U="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@audio/radar-ai-$N.mp3"
            H=$(curl -s -o /dev/null -D - -r 0-1023 "$U")
            echo "$N $(echo "$H" | grep -iE '^(HTTP|content-type)' | tr -d '\r' | tr '\n' ' ')"
          done
